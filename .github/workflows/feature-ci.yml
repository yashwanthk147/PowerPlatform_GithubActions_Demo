name: Power Platform CI/CD

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  changes:
    name: Detect Changes 
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        uses: younited/detect-branch-changes-action@v0.1.3
        with:
          pathspec: |
            solutions/**
            src/**
            workflows/**

  build:
    name: Export Managed Solution
    runs-on: ubuntu-latest 
    needs: changes
    if: needs.changes.outputs.changed == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Export Solution (Managed)
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ secrets.PP_DEV_ENV_URL }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          solution-name: aSolution
          managed: false
          solution-output-file: out/aSolution.zip

      - name: Unpack Solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: out/aSolution.zip
          solution-folder: solutions/aSolution/src
          overwrite-files: true

      - name: branch-solution (prepare repo for PR)
        uses: microsoft/powerplatform-actions/branch-solution@v1
        with:
          solution-folder: out/solutions/ALMLab
          solution-target-folder: solutions/ALMLab/src
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          allow-empty-commit: true